services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      NEXO_ADMIN_USER: ${NEXO_ADMIN_USER:-admin}
      NEXO_ADMIN_PASSWORD: ${NEXO_ADMIN_PASSWORD:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-}
    volumes:
      - nexo_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  nexo_data:
  caddy_data:
  caddy_config:
