services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      NEXO_ADMIN_USER: ${NEXO_ADMIN_USER:-admin}
      NEXO_ADMIN_PASSWORD: ${NEXO_ADMIN_PASSWORD:-}
      NEXO_SESSION_SECRET: ${NEXO_SESSION_SECRET:-}
      NEXO_CREDENTIAL_KEY: ${NEXO_CREDENTIAL_KEY:-}
      ML_CACHE_TTL: ${ML_CACHE_TTL:-900}
      ML_REVIEW_MAX_PAGES: ${ML_REVIEW_MAX_PAGES:-1}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-}
      PIXZY_BASE_URL: ${PIXZY_BASE_URL:-https://app.pixzypay.com/api}
      PIXZY_API_TOKEN: ${PIXZY_API_TOKEN:-}
      PIXZY_WEBHOOK_URL: ${PIXZY_WEBHOOK_URL:-}
    volumes:
      - nexo_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  nexo_data:
  caddy_data:
  caddy_config:
